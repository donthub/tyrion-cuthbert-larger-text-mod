# Publishes a GitHub release when a version tag is pushed.
#   vX.Y.Z          -> normal (latest stable) release
#   vX.Y.Z-suffix   -> prerelease (e.g. v2.0.0-rc.1)
# The runtime is built and all tests run before packaging; any failure stops the release.
# An existing release is never replaced. Only the built-in GITHUB_TOKEN is used.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix"
            exit 1
          fi
          version="${tag#v}"
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; it is never replaced."
            exit 1
          fi

      - name: Build runtime and run C++ tests
        run: python scripts/build_runtime.py --version "${{ steps.version.outputs.version }}" --test

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Package
        run: python scripts/package_release.py --version "${{ steps.version.outputs.version }}" --runtime build/release/version.dll --out dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; it is never replaced."
            exit 1
          fi
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/*.zip dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag "${args[@]}"
