name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build platform archives
        run: python scripts/package_release.py "$RELEASE_TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/TyrionCuthbertLargerTextMod-${RELEASE_TAG}-Windows.zip" \
            "dist/TyrionCuthbertLargerTextMod-${RELEASE_TAG}-Linux-SteamDeck.tar.gz" \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
